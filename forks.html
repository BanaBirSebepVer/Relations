---
layout: null
permalink: /forks/
---
<!DOCTYPE html>
<html lang="{{ site.default_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="forks-page" data-title-key="forks_page_title">

  <div class="forks-container">
    <div class="header-box">
      <a href="{{ '/' | relative_url }}" class="back-btn">&larr; <span data-i18n="back_to_graph"></span></a>
      <select id="lang-switcher" data-i18n-title="language_label" aria-label="Language"></select>
      <h1 data-i18n="forks_heading"></h1>
      <p data-i18n="forks_intro"></p>
    </div>

    <div id="forks-list" class="forks-grid">
      <p style="color: #94a3b8;" data-i18n="forks_loading"></p>
    </div>
  </div>

  <script>window.I18N_URL = "{{ '/api/i18n.json' | relative_url }}";</script>
  <script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await window.I18n.ready;
      const I18n = window.I18n;
      const container = document.getElementById("forks-list");
      // GitHub data is untrusted: escape it before building HTML strings
      const esc = (str) => String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
      // Only allow http(s) links
      const safeUrl = (url) => /^https?:\/\//i.test(url) ? url : null;
      const showMessage = (key, color) => {
        const p = document.createElement("p");
        p.style.color = color;
        p.setAttribute("data-i18n", key);
        p.textContent = I18n.t(key);
        container.replaceChildren(p);
      };

      // Detect the name of the main repository (default: banabirsebepver/Relations)
      let mainRepo = "banabirsebepver/Relations";
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      
      if (host.endsWith(".github.io") && pathParts.length > 0 && pathParts[0] !== "forks") {
        const owner = host.split(".")[0];
        mainRepo = `${owner}/${pathParts[0]}`;
      }

      try {
        // Fetch the fork list from the GitHub API (sorted by stars, max 100)
        const res = await fetch(`https://api.github.com/repos/${mainRepo}/forks?sort=stargazers&per_page=100`);
        if (!res.ok) throw new Error("API error");
        const forks = await res.json();

        if (!Array.isArray(forks) || forks.length === 0) {
          showMessage("forks_empty", "#64748b");
          return;
        }

        container.innerHTML = "";

        for (const fork of forks) {
          const card = document.createElement("div");
          card.className = "fork-card";

          // Use the custom domain (homepage) if the owner set one,
          // otherwise build the standard github.io address when GitHub Pages is enabled
          const liveUrl = safeUrl(fork.homepage && fork.homepage.trim() !== ""
            ? fork.homepage.trim()
            : (fork.has_pages ? `https://${fork.owner.login}.github.io/${fork.name}/` : ""));

          const updatedDate = new Date(fork.pushed_at).toLocaleDateString(I18n.lang);
          const defaultDesc = fork.description || I18n.t("site_description");

          card.innerHTML = `
            <div>
              <div class="fork-owner">
                <img src="${esc(fork.owner.avatar_url)}&s=80" alt="${esc(fork.owner.login)}">
                <div class="fork-owner-info">
                  <h3 id="title-${fork.id}">${esc(fork.name)}</h3>
                  <span>@${esc(fork.owner.login)}</span>
                </div>
              </div>
              <p class="fork-desc" id="desc-${fork.id}">${esc(defaultDesc)}</p>
            </div>
            <div>
              <div class="fork-meta">
                <span>⭐ ${esc(I18n.t("stars", { count: fork.stargazers_count }))}</span>
                <span>🕒 ${esc(I18n.t("last_updated", { date: updatedDate }))}</span>
              </div>
              <div class="fork-actions">
                <a href="${esc(fork.html_url)}" target="_blank" rel="noopener" class="btn-link btn-repo">${esc(I18n.t("github_repo"))}</a>
                ${liveUrl ? `<a href="${esc(liveUrl)}" target="_blank" rel="noopener" class="btn-link btn-live">${esc(I18n.t("view_network"))} &rarr;</a>` : ''}
              </div>
            </div>
          `;

          container.appendChild(card);

          // Extra: read the custom "title" and "description" from the fork's own _config.yml
          fetch(`https://raw.githubusercontent.com/${fork.full_name}/${fork.default_branch}/_config.yml`)
            .then(r => r.ok ? r.text() : null)
            .then(yamlText => {
              if (!yamlText) return;
              const titleMatch = yamlText.match(/^title:\s*["']?([^"'\n]+)["']?/m);
              const descMatch = yamlText.match(/^description:\s*["']?([^"'\n]+)["']?/m);
              
              if (titleMatch && titleMatch[1]) {
                document.getElementById(`title-${fork.id}`).textContent = titleMatch[1].trim();
              }
              if (descMatch && descMatch[1]) {
                document.getElementById(`desc-${fork.id}`).textContent = descMatch[1].trim();
              }
            })
            .catch(() => {}); // On error keep the default repository name
        }
      } catch (err) {
        console.error(err);
        showMessage("forks_error", "#ef4444");
      }
    });
  </script>
</body>
</html>
