---
layout: null
permalink: /forks/
---
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topluluk Ağları (Forks) | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="forks-page">

  <div class="forks-container">
    <div class="header-box">
      <a href="{{ '/' | relative_url }}" class="back-btn">&larr; Ağ Haritasına Dön</a>
      <h1>Topluluk Tarafından Geliştirilen Ağlar</h1>
      <p>Bu açık kaynaklı altyapıyı forklayarak kendi araştırma ve ilişki ağlarını oluşturan projeler.</p>
    </div>

    <div id="forks-list" class="forks-grid">
      <p style="color: #94a3b8;">Projeler GitHub üzerinden yükleniyor...</p>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("forks-list");

      // Mevcut ana deponun adını tespit et (veya varsayılan olarak banabirsebepver/Relations kullan)
      let mainRepo = "banabirsebepver/Relations";
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      
      if (host.endsWith(".github.io") && pathParts.length > 0 && pathParts[0] !== "forks") {
        const owner = host.split(".")[0];
        mainRepo = `${owner}/${pathParts[0]}`;
      }

      try {
        // GitHub API'den fork listesini çek (En çok yıldız alana göre sıralı, maksimum 100 adet)
        const res = await fetch(`https://api.github.com/repos/${mainRepo}/forks?sort=stargazers&per_page=100`);
        if (!res.ok) throw new Error("API hatası");
        const forks = await res.json();

        if (!Array.isArray(forks) || forks.length === 0) {
          container.innerHTML = "<p style='color:#64748b;'>Henüz forklanmış bir proje bulunmuyor. İlk forklayan siz olun!</p>";
          return;
        }

        container.innerHTML = "";

        for (const fork of forks) {
          const card = document.createElement("div");
          card.className = "fork-card";

          // Eğer kullanıcı kendi özel domainini (homepage) girdiyse onu al, 
          // girmediyse ama GitHub Pages açıksa standart github.io adresini oluştur
          const liveUrl = fork.homepage && fork.homepage.trim() !== "" 
            ? fork.homepage 
            : (fork.has_pages ? `https://${fork.owner.login}.github.io/${fork.name}/` : null);

          const updatedDate = new Date(fork.pushed_at).toLocaleDateString("tr-TR");
          const defaultDesc = fork.description || "Açık Kaynak İlişki ve Ağ Haritalama Platformu";

          card.innerHTML = `
            <div>
              <div class="fork-owner">
                <img src="${fork.owner.avatar_url}&s=80" alt="${fork.owner.login}">
                <div class="fork-owner-info">
                  <h3 id="title-${fork.id}">${fork.name}</h3>
                  <span>@${fork.owner.login}</span>
                </div>
              </div>
              <p class="fork-desc" id="desc-${fork.id}">${defaultDesc}</p>
            </div>
            <div>
              <div class="fork-meta">
                <span>⭐ ${fork.stargazers_count} Yıldız</span>
                <span>🕒 Son Güncelleme: ${updatedDate}</span>
              </div>
              <div class="fork-actions">
                <a href="${fork.html_url}" target="_blank" rel="noopener" class="btn-link btn-repo">GitHub Deposu</a>
                ${liveUrl ? `<a href="${liveUrl}" target="_blank" rel="noopener" class="btn-link btn-live">Ağı İncele &rarr;</a>` : ''}
              </div>
            </div>
          `;

          container.appendChild(card);

          // EKSTRA ÖZELLİK: Forklayan kişinin kendi _config.yml dosyasındaki özel "title" (Başlık) bilgisini çek
          fetch(`https://raw.githubusercontent.com/${fork.full_name}/${fork.default_branch}/_config.yml`)
            .then(r => r.ok ? r.text() : null)
            .then(yamlText => {
              if (!yamlText) return;
              const titleMatch = yamlText.match(/^title:\s*["']?([^"'\n]+)["']?/m);
              const descMatch = yamlText.match(/^description:\s*["']?([^"'\n]+)["']?/m);
              
              if (titleMatch && titleMatch[1]) {
                document.getElementById(`title-${fork.id}`).textContent = titleMatch[1].trim();
              }
              if (descMatch && descMatch[1]) {
                document.getElementById(`desc-${fork.id}`).textContent = descMatch[1].trim();
              }
            })
            .catch(() => {}); // Hata olursa varsayılan repo adını korur
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = "<p style='color:#ef4444;'>Projeler yüklenirken bir hata oluştu veya GitHub API limitine takıldı.</p>";
      }
    });
  </script>
</body>
</html>
