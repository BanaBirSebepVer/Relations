---
layout: null
---
{% include view/head.html %}
<body>

  <!-- Üst Menü & Kontroller -->
  <header id="top-bar">
    <div class="brand">
      <h1>{{ site.title }}</h1>
    </div>
    
    <div class="controls">
      <input type="text" id="search-input" placeholder="Düğüm ara (İsim, ID)...">
      <select id="type-filter">
        <option value="ALL">Tüm Tipler</option>
      </select>
      
      <!-- Çoklu Dil Seçici -->
      <select id="lang-switcher">
        <option value="tr">🇹🇷 TR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="ru">🇷🇺 RU</option>
      </select>

      <button id="reset-view-btn">Merkeze Al</button>
    </div>
  </header>

  <!-- Grafiğin Çizileceği Alan -->
  <main id="cy"></main>

  <!-- %80 Kapsayan Detay Sidebar'ı -->
  <aside id="sidebar" class="hidden">
    <div class="sidebar-header">
      <button id="close-sidebar-btn">&times;</button>
    </div>
    <div class="sidebar-body">
      <div id="sidebar-hero"></div>
      <div id="sidebar-meta"></div>
      <hr>
      <div id="sidebar-content"></div>
    </div>
    <div class="sidebar-footer">
      <span id="sidebar-source-link"></span>
    </div>
  </aside>

  {% include view/footer.html %}

  <!-- Göreceli JS ve Veri Yolları -->
  <script>
    window.GRAPH_DATA_URL = "{{ '/api/graph.json' | relative_url }}";
    window.GITHUB_REPO = ""; 
  </script>
  <script src="{{ '/assets/js/contributors.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>

  

</body>
</html>
