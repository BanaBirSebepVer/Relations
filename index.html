---
layout: null
---
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>

  <!-- Cytoscape Çekirdek -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  
  <!-- fcose Eklentisi ve Fizik Motoru Bağımlılıkları -->
  <script src="https://cdn.jsdelivr.net/npm/layout-base/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose/cytoscape-fcose.js"></script>

  <!-- Göreceli CSS Yolu -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <!-- Üst Menü & Kontroller -->
  <header id="top-bar">
    <div class="brand">
      <h1>{{ site.title }}</h1>
    </div>
    
    <div class="controls">
      <input type="text" id="search-input" placeholder="Düğüm ara (İsim, ID)...">
      <select id="type-filter">
        <option value="ALL">Tüm Tipler</option>
      </select>
      
      <!-- Çoklu Dil Seçici -->
      <select id="lang-switcher">
        <option value="tr">🇹🇷 TR</option>
        <option value="en">🇬🇧 EN</option>
        <option value="fr">🇫🇷 FR</option>
        <option value="de">🇩🇪 DE</option>
        <option value="ru">🇷🇺 RU</option>
      </select>

      <button id="reset-view-btn">Merkeze Al</button>
    </div>
  </header>

  <!-- Grafiğin Çizileceği Alan -->
  <main id="cy"></main>

  <!-- %80 Kapsayan Detay Sidebar'ı -->
  <aside id="sidebar" class="hidden">
    <div class="sidebar-header">
      <button id="close-sidebar-btn">&times;</button>
    </div>
    <div class="sidebar-body">
      <div id="sidebar-hero"></div>
      <div id="sidebar-meta"></div>
      <hr>
      <div id="sidebar-content"></div>
    </div>
    <div class="sidebar-footer">
      <span id="sidebar-source-link"></span>
    </div>
  </aside>

  <!-- Katkıcılar ve Forklar Alanı (Footer) -->
  <footer id="contributors-bar" style="justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span>Katkıda Bulunanlar:</span>
      <div id="contributors-list"></div>
    </div>
    
    <div>
      <a href="./forks/" style="color: #38bdf8; text-decoration: none; font-weight: 500; font-size: 13px;">
        🌐 Topluluk Ağlarını (Forks) Keşfet &rarr;
      </a>
    </div>
  </footer>

  <!-- Göreceli JS ve Veri Yolları -->
  <script>
    window.GRAPH_DATA_URL = "./api/graph.json";
    window.GITHUB_REPO = ""; 
  </script>
  <script src="./assets/js/contributors.js"></script>
  <script src="./assets/js/app.js"></script>

  <!-- ========================================== -->
  <!-- GOOGLE TRANSLATE ENTEGRASYONU -->
  <!-- ========================================== -->
  <div id="google_translate_element"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'tr', // Sitenin ana dili
        autoDisplay: false
      }, 'google_translate_element');

      // Özel menümüz ile Google Çeviri menüsünü birbirine bağlıyoruz
      setTimeout(function() {
        var langSelect = document.getElementById('lang-switcher');
        langSelect.addEventListener('change', function(e) {
          var targetLang = e.target.value;
          var googleCombo = document.querySelector(".goog-te-combo");
          
          if (googleCombo) {
            googleCombo.value = targetLang;
            // Google script'inin değişikliği algılaması için olayı tetikliyoruz
            if (document.createEvent) {
              var event = document.createEvent('HTMLEvents');
              event.initEvent('change', true, true);
              googleCombo.dispatchEvent(event);
            } else {
              var event = document.createEventObject();
              event.eventType = 'change';
              googleCombo.fireEvent('on' + event.eventType, event);
            }
          }
        });
      }, 1000); // Google bileşeninin DOM'a yüklenmesi için ufak bir gecikme
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

</body>
</html>
