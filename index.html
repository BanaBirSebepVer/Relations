---
layout: null
---
{% include view/head.html %}
<body>

  <!-- Top bar and controls -->
  <header id="top-bar">
    <div class="brand">
      <h1 data-i18n="site_title">{{ site.title }}</h1>
    </div>

    <div class="controls">
      <input type="text" id="search-input" data-i18n-placeholder="search_placeholder">
      <select id="type-filter">
        <option value="ALL"></option>
      </select>

      <!-- Language switcher (options are generated from _data/i18n/*.yml) -->
      <select id="lang-switcher" data-i18n-title="language_label" aria-label="Language"></select>

      <button id="reset-view-btn" data-i18n="reset_view"></button>
    </div>
  </header>

  <!-- Area where the graph is drawn -->
  <main id="cy"></main>

  <!-- Detail sidebar covering 80% of the screen -->
  <aside id="sidebar" class="hidden">
    <div class="sidebar-header">
      <button id="close-sidebar-btn">&times;</button>
    </div>
    <div class="sidebar-body">
      <div id="sidebar-hero"></div>
      <div id="sidebar-meta"></div>
      <hr>
      <div id="sidebar-content"></div>
    </div>
    <div class="sidebar-footer">
      <span id="sidebar-source-link"></span>
    </div>
  </aside>

  {% include view/footer.html %}

  <!-- Data paths relative to the base URL -->
  <script>
    window.GRAPH_DATA_URL = "{{ '/api/graph.json' | relative_url }}";
    window.I18N_URL = "{{ '/api/i18n.json' | relative_url }}";
    window.GITHUB_REPO = "";
  </script>
  <script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/contributors.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/edge-options.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/node-options.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/app.js' | relative_url }}"></script>

</body>
</html>
