# ==========================================
# UI TRANSLATIONS - ENGLISH (default language)
# ==========================================
# To add a new language, copy this file to `_data/i18n/<code>.yml`
# (e.g. `fr.yml`) and translate the values. Do NOT change the keys.
# The language appears in the language switcher automatically.
# Placeholders such as {count} or {login} must be kept as they are.

language_name: "English"   # Shown in the language switcher (write it in the language itself)
dir: "ltr"                 # Text direction: "ltr" or "rtl"
date_format: "%Y-%m-%d"    # Liquid/strftime date format used on static pages

site_title: "Researcher Relationship Network"
site_description: "Open Source Relationship and Network Mapping Platform"

