# ==========================================
# GRAPH AND UI SETTINGS
# ==========================================

# Network physics and layout parameters
layout:
  name: "fcose"           # "fcose" or "cose"
  node_repulsion: 4500    # How strongly nodes push each other away (spread distance)
  ideal_edge_length: 100  # Ideal length of connection lines
  gravity: 0.25           # Pull towards the center

# Node defaults
nodes:
  default_color: "#0284c7"
  border_color: "#0f172a"
  ghost_color: "#475569"  # Color of draft nodes that have no file yet
  min_size: 32            # Size of the node with the fewest connections
  max_size: 84            # Maximum size for the node with the most connections
  fixed_size: 36          # Size of nodes with size_mode: fixed

# Edge defaults
edges:
  default_color: "#64748b"
  highlight_color: "#38bdf8"
  min_width: 1
  max_width: 6

# Colors per category (type)
# (Used when no custom HEX color is set in the front matter)
type_colors:
  person: "#d97706"       # Orange/amber for people
  fund: "#2563eb"         # Blue for funds
  organization: "#9333ea" # Purple for organizations
  event: "#dc2626"        # Red for events
  ghost: "#475569"        # Gray for ghost nodes
