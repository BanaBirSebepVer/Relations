title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "/relations"
url: "https://banabirsebepver.github.io"

collections:
  nodes:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: "_nodes"           # "type: nodes" yerine klasör yolunu zorunlu kıldık
    values:
      layout: "default"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor