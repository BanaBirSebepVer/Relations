title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
# baseurl: "/Relations"
# url: "https://banabirsebepver.github.io"
url: "http://localhost:4000"
baseurl: ""

# Gelecek/güncel tarihli haberlerin (posts) derlenmeme sorununu çözer:
future: true

# Koleksiyon Yapılandırması
collections:
  nodes:
    output: true
    permalink: /:name/

# Varsayılan Şablon Atamaları
defaults:
  - scope:
      path: ""
      type: "nodes"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"


# Google analytics - GA4
google_analytics: [G-JBKH0DKETF]
enableDNT: true

# If you want to generate website sitemap, you can set true
# sitemap: false

# If you want to change site language, you can set lang option
lang: "tr"  # default lang is en
lang_text: "Türkçe"  # default lang_text is English


markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor