title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "" # Eğer proje reposu kullanıyorsanız: "/repo-adi"
url: ""

# Koleksiyon Tanımlamaları
collections:
  nodes:
    output: true
    permalink: /nodes/:path/

# Markdown Ayarları
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Dahil Edilecek ve Hariç Tutulacak Dosyalar
include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor