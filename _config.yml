title: "Researcher Relationship Network"
description: "Open Source Relationship and Network Mapping Platform"
# The site is published under the /Relations sub-path on GitHub Pages.
# All CSS/JS/link paths are built from this baseurl with the `relative_url` filter.
# Locally: `bundle exec jekyll serve` -> http://localhost:4000/Relations/
# If you forked the project, set baseurl to your own repository name (e.g. "/MyRepo").
url: "https://banabirsebepver.github.io"
baseurl: "/Relations"

# Build posts even if their date is in the future:
future: true

# Collections
collections:
  nodes:
    output: true
    permalink: /:name/

# Default layouts
defaults:
  - scope:
      path: ""
      type: "nodes"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"


# Google analytics - GA4 (set your own measurement ID; unused by the default templates)
# google_analytics: [G-XXXXXXXXXX]
# enableDNT: true

# Internationalization
# UI strings live in `_data/i18n/<code>.yml`; every file there is offered in the
# language switcher. `default_lang` is the fallback for missing translations and
# the language assumed for content files that have no `lang` front matter.
default_lang: "en"


markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - vendor