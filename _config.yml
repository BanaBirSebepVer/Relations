title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "/relations"
url: ""

# Koleksiyon Yapılandırması
collections:
  nodes:
    output: true
    permalink: /:slug/   # /nodes/ kısmını kaldırdık, adresler doğrudan kök dizinde olacak

# Varsayılan Şablon Atamaları (404'ü Çözen Güncelleme)
defaults:
  - scope:
      path: "_nodes"           # "type: nodes" yerine doğrudan klasör yolunu hedefledik
    values:
      layout: "default"        # _nodes içindeki her dosyaya şablon uygulanmasını garanti eder

# Markdown Ayarları
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor