title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "/relations"
url: ""

# Koleksiyon Yapılandırması
collections:
  nodes:
    output: true
    permalink: /nodes/:slug/   # Sayfaları root yerine /nodes/ dizini altında toparlar

# Varsayılan Şablon Atamaları (404 Hatasını Çözen Kısım)
defaults:
  - scope:
      path: ""
      type: "nodes"            # Sadece nodes koleksiyonuna etki eder
    values:
      layout: "default"        # Tümüne otomatik olarak _layouts/default.html şablonunu uygular

# Markdown Ayarları
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor