title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "/relations"
url: "https://banabirsebepver.github.io"

# Koleksiyon Yapılandırması
collections:
  nodes:
    output: true
    permalink: /:name/       # DİKKAT: Koleksiyonlarda :slug çalışmaz, :name ZORUNLUDUR!

# Varsayılan Şablon Atamaları
defaults:
  - scope:
      path: ""               # Tüm klasörleri kapsar
      type: "nodes"          # Sadece nodes koleksiyonuna uygular
    values:
      layout: "default"      # _layouts/default.html şablonunu giydirir

# Markdown Ayarları
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor