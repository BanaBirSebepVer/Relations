title: "Araştırmacı İlişki Ağı"
description: "Açık Kaynak İlişki ve Ağ Haritalama Platformu"
baseurl: "/Relations"
url: "https://banabirsebepver.github.io"

# Gelecek/güncel tarihli haberlerin (posts) derlenmeme sorununu çözer:
future: true

# Koleksiyon Yapılandırması
collections:
  nodes:
    output: true
    permalink: /:name/

# Varsayılan Şablon Atamaları
defaults:
  - scope:
      path: ""
      type: "nodes"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

include:
  - api

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - template.md
  - tree.txt
  - vendor